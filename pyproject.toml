[project]
name = "acs_triage"
version = "0.1.0"
description = "ACS / chronic CAD telephone triage ambient copilot — Phase 0 rules engine and simulator"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-q"
