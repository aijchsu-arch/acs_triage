# 中間帶（T1／T2／T4）情境 v0.2（檔名沿用 v0.1 以免更動引用）
# 來源：docs/ADJUDICATION_Q05_Q11.md Part B；Clinical Owner 於 2026-10-12 裁定（含 X1–X3 衝突解決：B3→0、B7→1、B11→0；補 B19=1、B20=4）。
# truth_tier / truth_hard_stop 為 ground truth（D-13）。
# hidden_slots：模擬病人可回答的事實；未列出的 slot 視為 false / unknown（模擬病人回答「沒有」或「不知道」）。
# 分布：T0 2／T1 4／T2 4／T3 6／T4 4。

scenarios_version: "0.2"
rules_version_required: "0.3.1"

scenarios:
  - id: S-MID-01
    source: B1
    name: 新發胸悶已緩解未滿 24h
    opening_zh: "昨天晚上胸口悶了大概十分鐘，自己好了，今天到現在都沒有再發作。"
    truth_tier: 1
    truth_hard_stop: false
    rule_ref: "§5.4 (DV-1)"
    hidden_slots:
      onset_new: true
      symptom_character: tightness
      last_episode_timing: yesterday_within_24h
      episode_duration_min: 10
      recurrence: false
      ongoing_now: false
      rest_symptom: false       # 原為 null；e2e 需病人可答，取與 T1 一致之值
      exertion_relation: unclear
      diaphoresis: false
      presyncope: false
    decisive_questions: [Q-ONGOING-01, Q-SYNCOPE-01, Q-DYSPNEA-GRADE-01, Q-DIAPH-01, Q-ONSET-01, Q-THRESHOLD-01, Q-REST-01, Q-CHARACTER-01, Q-TIMING-01, Q-NTG-01]
    boundary_variants:
      - override: {last_episode_timing: today}
        expect: {tier: 0, hard_stop: false}
      - override: {last_episode_timing: over_24h, rest_symptom: false}
        expect: {tier: 2, hard_stop: false}
      - override: {diaphoresis: true}
        expect: {tier: 0, hard_stop: true, rf: RF-06}

