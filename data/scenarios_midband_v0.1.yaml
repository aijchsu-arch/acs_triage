    truth_tier: 2
    truth_hard_stop: false
    rule_ref: "§5.5 (DV-2)"
    hidden_slots:
      presyncope: false
      syncope: false
      onset_new: true
      onset_weeks_ago: 3
      symptom_character: tightness
      exertion_relation: exertion_only
      rest_symptom: false
      threshold_decreased: false
      ongoing_now: false
      diaphoresis: false
    decisive_questions: [Q-ONGOING-01, Q-SYNCOPE-01, Q-DYSPNEA-GRADE-01, Q-DIAPH-01, Q-ONSET-01, Q-THRESHOLD-01, Q-REST-01, Q-EXERTION-01, Q-TIMING-01, Q-ONSET-WEEKS-01, Q-NTG-01]
