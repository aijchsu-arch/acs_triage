# 機器可讀之臨床規則 —— 與 docs/CLINICAL_RULES.md 同步，rules_version 必須一致。
# 只有 Clinical Owner 可改內容。tests/test_m0_loaders.py 會比對版本號與 RF 數量。
# 等級判斷的條件邏輯（§5.3–§5.8）在 src/acs_triage/rules/tiers.py 以程式碼表達，
# 每個條件以 rule_id 對應回本檔 tier_rules 清單，便於稽核。

rules_version: "0.8.0"   # 0.8.0 含兩項 Clinical Owner 2026-10-22 裁定：D-50 紅旗題與關鍵題有條件複誦確認（嚴重度順序取值）；異常檢查待追蹤 → 至少 T1，不論有無症狀（D-46：Q-REST-02 列入 STT 關鍵題（D-45：Q-05 三變體裁定（T2-DYSPNEA-HEAVY、T3-STABLE-REST-RECURRENT）、T1-THRESHOLD-WEEKS／T3-POST-PCI-MILDER 定案前必問（D-44：DV-5 不接受 unclear；vague → T9）））
source_doc: docs/CLINICAL_RULES.md

tiers:
  0: {name: T0 Emergency, definition: 立即 EMS／急診緊急評估}
  1: {name: T1 Same-day, definition: 當日必須接受醫療評估}
  2: {name: T2 24–72 h, definition: 24–72 小時內快速評估}
  3: {name: T3 Routine, definition: 一般門診追蹤（可附 expedite）}
  4: {name: T4 Self-care, definition: 可先衛教／觀察，必須附 safety net}
  9: {name: Unable to determine, definition: 現有資訊不足，不能安全指定 0–4}

thresholds:
  max_questions: 11        # 8 → 10（D-22）→ 11（Q-15，Clinical Owner 2026-10-14）：Q-14b 後 PCI＋模糊開場之穩定型需 11 題
  stt_min_confidence: 0.75
  stt_min_confidence_critical: 0.9      # D-43：紅旗題（priority=redflag）與下列題目；低於門檻即重問（Clinical Owner 2026-10-18）
  stt_critical_questions: [Q-CHARACTER-01, Q-REST-02]   # D-42：Q-CHARACTER-01 聽錯是唯一會讓 HS／T0 掉到 T1–T4 的單點；D-46：Q-REST-02 為 T0→T3 單一開關（D-45 規則）
  stt_confirm_back: true   # D-50：紅旗題與上列題目的回答可疑時複誦確認一次（不算題數）；值已是最嚴重一級或寫入即 Hard stop 者不複誦；確認後依 confirm_back_severity 取較嚴重者（Clinical Owner 2026-10-22，方案 1；CLINICAL_RULES §5.10）
  rf_model_threshold: 0.5
  stable_pattern_min_months: 6        # §5.6 穩定型
  new_stable_pattern_min_weeks: 2     # DV-2
  callback_max_minutes: 30            # Tier 9 回撥

# D-50 複誦確認的嚴重度順序（Clinical Owner 2026-10-22 裁定，rules 0.8.0；CLINICAL_RULES §5.10）。
# 每個 slot 由最嚴重排到最不嚴重；同一個 [] 內同級。yes_no 適用範圍內所有是非題。
# 用途：(1) 解讀值已在第一級 → 不複誦；(2) 原值與確認值都已知 → 取較嚴重者，同級保留原值。
confirm_back_severity:
  yes_no: [[true], [false]]
  dyspnea_grade: [[rest], [exertional_daily], [exertional_heavy], [none]]
  symptom_character: [[pressure, tightness, jaw_shoulder_heaviness], [epigastric], [pain], [vague], [other], [none]]   # none（否認胸部症狀）排最後；此 slot 無 unknown

# 「缺血等價症狀」= symptom_character ∈ ischemic_characters
ischemic_characters: [pressure, tightness, pain, jaw_shoulder_heaviness, epigastric]
# 「胸部症狀存在」= symptom_character ∈ chest_symptom_characters（含未定性之 vague）
chest_symptom_characters: [pressure, tightness, pain, jaw_shoulder_heaviness, epigastric, vague]

# ---------------- §3 紅旗（slot 層條件；文字層關鍵詞在 data/extraction_patterns.yaml） ----------------
red_flags:
  - id: RF-01
    name: 胸部症狀合併瀕厥或暈厥
    when: {chest_symptom_present: true, any_true: [presyncope, syncope]}
  - id: RF-02
    name: 靜止休息時仍有呼吸困難
    when: {dyspnea_grade: rest}
    note: 即使疑似焦慮／恐慌仍 Y（D-07）。端坐呼吸／PND 不算（C1 B）。
  - id: RF-03
    name: 來電當下胸部症狀仍持續中
    when: {chest_symptom_present: true, ongoing_now: true}
  - id: RF-04
    name: 無法完整說完一句話或口唇發紺
    when: {cant_finish_sentence: true}
  - id: RF-05
    name: 真正意識喪失
    when: {syncope: true}
  - id: RF-06
    name: 胸部症狀合併明顯冒汗
    when: {chest_symptom_present: true, diaphoresis: true}

# ---------------- §4 不得降級 ----------------
no_downgrade:
  - {id: ND-01, rule: 模型輸出不得比規則引擎更不急；違者取規則結果並標記 model_downgrade_blocked}
  - {id: ND-02, rule: "ECG 只能升級：final = min(symptom_tier, ecg_tier)；ECG 正常不產生降級或安撫"}
  - {id: ND-03, rule: 病人主觀歸因（藥物、緊張）不得作為降級依據}
  - {id: ND-04, rule: 先前 ECG 正常、NTG 有效、症狀輕微、無 literal chest pain 皆不得降級}
  - {id: ND-05, rule: CAD／PCI 本身不升級；抗血小板中斷有症狀 → 升級因子；無症狀 → T3 + expedite}

# ---------------- §5 等級規則索引（條件在程式碼，id 供稽核與 audit） ----------------
tier_rules:
  T0:
    - {id: T0-NEW-TODAY, ref: "§5.3 (DV-1)", text: 新發胸部症狀且最後一次在今天、現在仍在、或時序未知；非缺血型豁免（刺痛可重現／刺痛咳嗽／上腹餐後）一律排除；勞累型豁免（DV-2／DV-4）只在時序不明時排除（Q-14d C）}
    - {id: T0-THRESHOLD-DAYS, ref: "§5.3 C3 B", text: 活動閾值下降且時間尺度為數天或不明}
    - {id: T0-REST-NEW, ref: "§5.3", text: 新發休息時症狀（首次不明時以首次視之）}
    - {id: T0-DYSPNEA-ACUTE, ref: "§5.3", text: 今日突發且與基線明顯不同之呼吸困難}
    - {id: T0-NTG-INCREASED, ref: "§5.3 C4 A (DV-6)", text: 既有型態下 NTG 用量明顯增加}
    - {id: T0-ORTHOPNEA, ref: "§5.3 C1 B", text: 端坐呼吸／PND（非 Hard stop）}
  T1:
    - {id: T1-NEW-YESTERDAY, ref: "§5.4 (DV-1)", text: 新發胸部症狀、最後一次在昨天（<24h）、今日無發作；非缺血型豁免除外（Q-14d C）}
    - {id: T1-THRESHOLD-WEEKS, ref: "§5.4 C3 B", text: 活動閾值於數週～一個月緩慢下降}
    - {id: T1-PENDING-TEST, ref: "§5.4 (rules 0.8.0)", text: 檢查異常待追蹤未掛號 → 至少 T1，不論有無症狀：無症狀直接 T1；有症狀者 Hard stop／T0 照常優先、T2–T4 提高到 T1（沿用原規則必要 slot）、T9 照常繼續問且備援至少 T1；有症狀暫判 T2–T4 且此項未知 → 定案前加問一次（Prompter.pending_test_question，算題數，達上限不問）}
    - {id: T1-ANTIPLT-SYMPTOMATIC, ref: "§5.4 (DV-3)", text: 新發胸部症狀合併抗血小板中斷}
  T2:
    - {id: T2-NEW-OVER24H, ref: "§5.5 C2 C", text: 新發胸部症狀、已緩解 ≥24h、無再發、無休息症狀；非缺血型豁免除外（Q-14d C）}
    - {id: T2-NEW-STABLE-WEEKS, ref: "§5.5 (DV-2)", text: 新發勞累性、≥2 週、型態穩定、無休息、無閾值下降}
    - {id: T2-DYSPNEA-DAILY, ref: "§5.5", text: 日常勞動性呼吸困難、非今日突發、無端坐呼吸、無胸部症狀（含合併水腫）}
    - {id: T2-POSTURAL-NEWMED, ref: "§5.5", text: 新藥後姿勢性頭暈、無胸部症狀、無瀕厥}
    - {id: T2-DYSPNEA-HEAVY, ref: "§5.5 (Q-05, D-45)", text: 主訴呼吸困難、僅激烈運動才喘、非今日突發、無端坐呼吸、無胸部症狀}
  T3:
    - {id: T3-STABLE, ref: "§5.6", text: 已知穩定型態 ≥6 個月且無任何升級因子}
    - {id: T3-STABLE-REST-RECURRENT, ref: "§5.6 (Q-05, D-45)", text: 型態 ≥6 個月不變、休息時症狀非首次且已緩解、明確否認閾值下降與 NTG 增加、無其他升級因子（CAD 病史定案前須問到）}
    - {id: T3-ADMIN, ref: "§5.6 (DV-7)", text: 門診排程事務且否認症狀}
    - {id: T3-ANTIPLT-ASYMPTOMATIC, ref: "§5.6 C7 C", text: 抗血小板中斷且無症狀 → T3 + expedite（expedite 只在 T3 附加，被待追蹤檢查下限提高到 T1 時不附，rules 0.8.0）}
    - {id: T3-PALPITATIONS, ref: "§5.6 C8 B", text: 心悸、無胸部症狀、無瀕厥／暈厥；不建議居家 ECG}
    - {id: T3-POST-PCI-MILDER, ref: "§5.6 (DV-4)", text: PCI 後輕症較術前輕、純勞累、無休息、無閾值下降}
    - {id: T3-POSTPRANDIAL, ref: "§5.6 (DV-5)", text: 上腹不適（epigastric）、餐後、打嗝後完全緩解、非活動相關、無冒汗（Q-14e）}
    - {id: T3-MECHANICAL, ref: "§5.6", text: 刺痛（pain）、按壓／深呼吸可重現且活動不加重（Q-14e）}
    - {id: T3-COUGH, ref: "§5.6", text: 刺痛（pain）、咳嗽相關且非勞累性（Q-14e）}
  T4:
    - {id: T4-CONSULT, ref: "§5.7 (DV-7)", text: 衛教問題／藥物處理／輕微非心臟問題且否認任何胸悶、喘、暈}
  T9:
    - {id: T9-THIRD-PARTY-UNREACHABLE, ref: "§5.8", text: 第三方來電且病人不可及}
    - {id: T9-VAGUE-CHARACTER, ref: "§5.8 (D-44)", text: 症狀未定性（vague）且不符例外（A 穩定型成立且非新發 → T3；B 新發且活動相關 → 走一般規則）；不依賴症狀性質的 T0 觸發因子與紅旗仍優先}
    - {id: T9-NO-RULE, ref: "§5.8", text: 無任何 0–4 規則成立（無法判定新發 vs 穩定、呼吸困難未分級）}
    - {id: T9-GATE, ref: "§5.9", text: provisional 已定但 sufficiency gate 未過}

# ---------------- §5.8 Tier 9 且護理師不可得之預設（C6 D） ----------------
# rules 0.8.0（Clinical Owner 2026-10-22）：pending_abnormal_test 為 true 時，下列預設等級至少 T1（pathway/router.py tier9_fallback）
tier9_nurse_unavailable_fallback:
  chest_or_equivalent: 1
  dyspnea_rest_excluded: 1
  palpitations_or_dizziness_no_chest: 2
  third_party_unreachable: {tier: 1, extra_action: family_relay_safety_net}
  consult_no_symptoms: 3

# ---------------- §6 流程對照 ----------------
pathways:
  hard_stop: {script: S-HS, actions: [read_script_verbatim, stay_on_line_until_119_confirmed, notify_supervisor_nurse], safety_net: null}
  0: {script: S-T0, actions: [instruct_ed_or_119, notify_nurse], safety_net: S-SN-A}
  1: {script: S-T1, actions: [transfer_nurse_same_day_callback], safety_net: S-SN-A}
  2: {script: S-T2, actions: [schedule_rapid_clinic_24_72h], safety_net: S-SN-A}
  3: {script: S-T3, actions: [routine_schedule], optional_actions: [expedite], safety_net: S-SN-B}
  4: {script: S-T4, actions: [education_script], safety_net: S-SN-A}
  9: {script: S-T9, actions: [transfer_nurse_sync, callback_within_30min_if_async], safety_net: S-SN-A, nurse_unavailable: use_fallback_table}

# ---------------- §3.8 ECG adjunct 建議窗口 ----------------
ecg_suggestion:
  allowed_when_provisional_in: [9, 1, 2]
  allowed_complaints: [vague_rest_discomfort, isolated_dizziness]   # 心悸已移除（C8 B）
  never_when: [hard_stop, tier_0, ongoing_chest_symptom]
