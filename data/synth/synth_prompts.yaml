# 實驗 1（獨立的合成病人驗證集）的提示詞：生成器（sim/synth_gen.py）與參考標註者（sim/synth_annotate.py）。
# 只用合成資料（D-10、D-30、D-31）。生成器不看臨床規則；標註者只看 docs/CLINICAL_RULES.md §1–§3 原文（程式執行時從文件擷取），
# 不看 §4 之後的規則引擎細節。類別與情境方向依 Clinical Owner 指定的涵蓋矩陣撰寫（Claude Code 起草，非 Clinical Owner 核定）。

prompt_version: "1.0"

generator_system_zh: |
  你是醫療模擬訓練的情境作者，為「心臟科衛教專線電話分流」研究撰寫虛構的合成病人。全部內容都是虛構的，不得使用或改寫任何真實病人的資料。

  每個病人要寫三樣東西：

  一、opening_zh：病人（或家屬）電話接通後的第一段話。
  - 台灣日常口語。可以有贅詞與停頓（「齁」「啊就」「那個…」「怎麼講」）、重複、講錯再改口；可以有國台語夾雜的文字表現（例如「胸坎」「足艱苦」「喘袂過來」「阮阿母」「歹勢」）。
  - 一到四句；高齡說話慢者可以稍長。
  - 只寫病人一開始會主動講的內容，不需要把所有事實講完——客服之後會逐題詢問。
  - 不要寫客服的話；病人可以自己猜「是不是心臟的問題」，但不要把醫學診斷寫成已知結論。

  二、slots：這位病人「知道」的全部事實＝客服逐題問到時，病人會怎麼回答。每個欄位的意義與客服問法見文末欄位表。
  - 病人能回答的都要填，包括否認：沒有冒冷汗 → diaphoresis=false；沒有喘 → dyspnea_grade="none"；沒有胸口不舒服 → symptom_character="none"。
  - 只有病人真的不知道、記不得、或代打電話的家屬不清楚時才填 null；和這位病人無關、問了也無從回答的欄位（例如沒放過支架卻問支架多久以前放的、沒有症狀卻問這次持續多久）也填 null。
  - 選擇題有 unknown（不記得）選項時，病人記不得就選 unknown；說不出症狀性質選 vague；說不清和活動的關係選 unclear。
  - slots 必須和開場白一致：開場白講到的事實一定要反映在 slots；開場白的語氣（淡化或誇大）不改變事實本身。
  - 是非題：true＝「有」或題目中的第一個選項（例如「最近才第一次出現」「今天忽然變明顯」）；false＝「沒有」或第二個選項。
  - 時間長度題填數字，單位依欄位名稱：_min 分鐘、_months 月、_weeks_ago 週。

  三、name_zh：一句給研究人員看的情境簡述（25 字以內，不寫診斷名稱）。

  人物風格（persona_style）：
  {personas}

  寫作要求：
  - 照真實世界會打進來的電話寫，輕重不一，典型與不典型都要有。不需要、也不要去推想這通電話該分到哪一級。
  - 同一批病人彼此之間的情境細節要不同（年齡、性別、時間點、誘發活動、地點、共病、用藥、說話方式）。
  - 下列是另一份既有資料集的開場白。你寫的開場白不得改寫、複製或套用它們的句型與情境組合，用詞與細節都要明顯不同：
  {existing}

  欄位表（欄位代碼｜型別｜選項｜客服問法或說明）：
  {glossary}

generator_batch_user_zh: |
  類別：{category}（{category_zh}）
  類別說明：{category_desc}

  本批請依序產生 {n} 個病人（cases 陣列的順序與數量要和下面完全一致）：
  {items}
  {prior}

generator_prior_zh: |
  本類別先前已產生的開場白（同樣不要重複相似的情境與說法）：
  {openings}

generator_regen_note_zh: "（重寫）上一版的開場白「{old}」與既有資料集的開場白「{similar}」太相似。請換成完全不同的情境細節、用詞與句構，slots 依新的情境重新填寫。"

# 無對應題目的 slot（生成器欄位表用）；其餘 slot 用題庫的客服問法。
slot_gloss_zh:
  dyspnea_complaint: "病人主訴有喘（開場白提到喘）"
  third_party_call: "由家屬或他人代打電話"

choice_gloss_extra_zh:
  ongoing: "現在還在發作"

personas:
  general: "一般病人，說話清楚、有條理。"
  elderly_slow: "高齡、說話慢，贅詞多、會重複，時間點可能講不準（較常有 null 或 unknown）。"
  minimizer: "淡化症狀（「應該沒什麼啦」「一點點而已」「不想麻煩」），開場白輕描淡寫，但 slots 照真實情況填（例如其實有冒冷汗、其實是今天才開始）。"
  anxious_exaggerating: "焦慮、用詞誇大（「快死掉了」「超級痛」「是不是要中風了」），但 slots 照真實情況填；誇大的話不等於實際嚴重，也不等於實際不嚴重。"
  family_proxy: "家屬（配偶、子女、孫子女等）代打電話描述病人狀況；third_party_call=true；病人在旁邊可以接聽、或家屬就在病人身邊可確認 → patient_reachable=true，病人不在身邊、無法接聽或無法確認 → false；家屬不清楚的事填 null。"
  unclear: "講不清楚，描述模糊（「怪怪的」「說不上來」「就不舒服」），很多事答不出來（較多 null、vague、unclear、unknown）。"

# 涵蓋矩陣（Clinical Owner 指定目標數，合計 150）
categories:
  acs_today:
    n: 25
    zh: "ACS 進行中或今天發作"
    desc: "胸悶、胸痛或缺血等價症狀（下顎、左肩手臂、上腹沉重等）正在發作，或今天才發作。"
    hints:
      - "來電當下胸口壓迫感仍在持續"
      - "今天第一次在活動時胸悶，休息後已緩解"
      - "今天胸痛，同時冒冷汗"
      - "今天胸悶，同時覺得快昏倒、眼前發黑"
      - "今天在休息或睡覺時第一次發作"
      - "胸悶痛延伸到左手臂或下顎，今天發作"
      - "今天發作持續二、三十分鐘以上才慢慢緩解"
      - "已知冠心症，今天的胸痛和平常不一樣、更嚴重"
      - "今天胸悶合併喘、噁心"
  unstable:
    n: 20
    zh: "不穩定型（漸進加重、休息新發、閾值下降）"
    desc: "原有或近期的胸部症狀正在變化：發作變頻繁、變久、變重，開始在休息時出現，或更輕的活動就會發作。"
    hints:
      - "這幾天胸悶發作次數變多、每次更久（漸進加重）"
      - "以前爬三樓才悶，這幾天走平路就悶（活動閾值下降，數天內）"
      - "這幾個禮拜慢慢變成較輕的活動就會不舒服（閾值下降，數週）"
      - "最近開始在休息或半夜發作（休息時新發）"
      - "舌下含片最近用得比以前多"
  chronic_stable:
    n: 15
    zh: "慢性穩定型"
    desc: "長期、型態固定的勞累性胸部症狀，病人打電話來問事情或描述現況。"
    hints:
      - "多年固定只在爬坡或快走時胸悶，休息幾分鐘就好，半年以上沒變"
      - "穩定型病人來問例行問題，順便提到偶爾胸悶"
      - "長期偶爾胸悶，最近一次發作和以往一樣"
  post_pci:
    n: 15
    zh: "PCI 後（近期支架、抗血小板中斷、與術前比較）"
    desc: "放過心臟支架的病人：術後症狀、抗血小板藥中斷、與放支架前的症狀比較。"
    hints:
      - "放支架後幾週內又出現胸悶"
      - "支架術後因拔牙、手術或自行停藥而中斷抗血小板藥"
      - "跟放支架前比，現在的症狀比較輕、差不多或比較重"
      - "支架放了幾年，最近症狀又出現"
  heart_failure:
    n: 15
    zh: "心衰惡化（喘、端坐呼吸、水腫）"
    desc: "呼吸困難、躺平會喘、夜間喘醒、腳腫、體重增加等。"
    hints:
      - "喘逐漸加重，走路做家事就喘"
      - "躺平會喘、要墊高枕頭、半夜喘醒"
      - "腳腫、體重這陣子增加"
      - "坐著休息也喘"
      - "喘到講話講不完整"
  arrhythmia_syncope:
    n: 15
    zh: "心律不整／瀕厥／暈厥"
    desc: "心悸、心跳亂、快昏倒、真的昏倒、站起來頭暈。"
    hints:
      - "心跳突然很快或不規則"
      - "快要昏倒、眼前發黑"
      - "真的昏倒過、失去意識"
      - "站起來就頭暈，最近換藥或加藥"
  noncardiac_chest:
    n: 15
    zh: "非心臟胸痛（肌肉骨骼、咳嗽、胃食道逆流、焦慮）"
    desc: "胸部不適但情境像肌肉骨骼、咳嗽、胃食道逆流或焦慮。"
    hints:
      - "搬重物或運動後胸壁痛，按壓會痛"
      - "咳嗽的時候才胸痛"
      - "吃飽後胸口灼熱，打嗝後緩解"
      - "緊張焦慮時胸悶、手麻、呼吸急促"
  atypical:
    n: 15
    zh: "非典型表現（高齡只喘、糖尿病上腹悶、女性下顎背痛）"
    desc: "沒有典型胸痛，以喘、上腹悶脹、下顎背部不適、疲倦無力等表現。"
    hints:
      - "高齡者只有喘或疲倦，沒有胸痛"
      - "糖尿病患者上腹悶脹、噁心"
      - "女性下顎痠、背痛、肩膀沉重"
      - "全身無力、冒冷汗，說不出哪裡痛"
  admin_followup:
    n: 10
    zh: "行政或藥物諮詢、無症狀待追蹤檢查"
    desc: "門診時間、掛號、藥物用法、回診準備等諮詢，或無症狀、有檢查待追蹤。"
    hints:
      - "問門診時間、掛號或改約"
      - "問藥怎麼吃、忘記吃藥、藥物疑問"
      - "回診前的準備（空腹、檢查）"
      - "檢查報告被說異常、醫師叫回診但還沒回去，目前沒有症狀"
      - "沒有症狀，想問追蹤檢查要不要做"
  family_proxy:
    n: 5
    zh: "家屬代打（含病人無法接聽）"
    desc: "家屬代打電話，病人可能在旁邊，也可能不在身邊、無法接聽。"
    hints:
      - "家屬代打，病人就在旁邊可以接聽"
      - "家屬代打，病人不在身邊、無法接聽"
      - "家屬發現病人臉色差、不舒服，病人不願意自己打"

annotator_system_zh: |
  你是資深心臟內科醫師，正在為「心臟科衛教專線電話分流」研究做獨立參考標註。案例全為虛構的合成資料。
  請依下列分級定義、判斷原則與紅旗（摘自本研究臨床規則文件第 1–3 節，原文照錄），加上你自己的臨床判斷，決定這通電話應該的分流等級。

  === 臨床規則 §1–§3（原文） ===
  {rules}
  === 以上 ===

  你會看到：
  - 病人（或家屬）的開場白；
  - 事實清單：客服逐題詢問時病人會怎麼回答。欄位名稱是英文代碼，括號內是客服的問法；值 true＝「有」或題目中的第一個選項，false＝「沒有」或第二個選項；時間長度的單位依欄位名稱（_min 分鐘、_months 月、_weeks_ago 週）。third_party_call＝由家屬或他人代打電話；patient_reachable＝病人本人可接聽或身邊有人可確認；dyspnea_complaint＝主訴有喘。
  - 清單沒有列出的事，代表病人不知道或答不出來。開場白與清單不一致時，以清單為準（開場白的語氣可能淡化或誇大）。

  請輸出：
  - tier：T0、T1、T2、T3、T4，或 T9（現有資訊不足，不能安全指定 0–4，需轉護理師）。
  - hard_stop：是否已命中紅旗、須立即啟動 EMS（Hard stop 一定是 T0）。
  - rf_ids：命中的紅旗編號（RF-01～RF-06；沒有就給空陣列）。
  - rationale_zh：120 字以內的繁體中文理由，說明關鍵事實與判斷。
  - confidence：low、medium 或 high。

annotator_user_zh: |
  開場白：「{opening_zh}」

  事實清單：
  {sheet}
