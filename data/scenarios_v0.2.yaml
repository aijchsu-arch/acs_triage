# v0.2 benchmark 的 18 個唯一情境
# reviewer_tier / reviewer_hard_stop：Claude v0.2 盲性審查標籤，不是 oracle。
# truth_tier / truth_hard_stop：Clinical Owner 於 2026-10-10 裁定（A1–A18 全部同意 reviewer 標籤）。
# benchmark_ids：原始 80 列中對應的案例編號（逐字重複）。
# hidden_slots：M2 模擬病人用（Claude 依 truth 與 reviewer boundary 撰寫，非 Clinical Owner 標籤）；
#   persona: vague = 紅旗題答「沒有」、決定性題答「不知道」，用以測試 Tier 9 節制行為。
# boundary_variants：M2 模擬器要展開的 hidden case sheet 變體（slot 覆寫 → 預期結果）。

scenarios_version: "0.2"

scenarios:
  # ===== 急性／疑似缺血性症狀 =====
  - id: S-ACUTE-01
    module: acute
    name: 新發活動時胸部壓迫
    opening_zh: "今天第一次在快走時胸口像被壓住，休息後才比較好。"
    benchmark_ids: [ACS-LT-001, ACS-LT-007, ACS-LT-013, ACS-LT-019]
    reviewer_tier: 0
    reviewer_confidence: 3
    reviewer_hard_stop: false
    truth_tier: 0
    truth_hard_stop: false
    hidden_slots:
      ntg_use_increased: false
      threshold_decreased: false
      dyspnea_acute: false
      antiplatelet_interrupted: false
      onset_new: true
      symptom_character: pressure
      last_episode_timing: today
      exertion_relation: exertion_only
      ongoing_now: false
      rest_symptom: false
      presyncope: false
      syncope: false
      diaphoresis: false
      nausea: false
      episode_duration_min: 5
      recurrence: false
      dyspnea_grade: none
    decisive_questions: [Q-ONGOING-01, Q-SYNCOPE-01, Q-DYSPNEA-GRADE-01, Q-DIAPH-01, Q-ONSET-01, Q-CHARACTER-01, Q-TIMING-01]
    boundary_variants:
      - override: {ongoing_now: true}
        expect: {tier: 0, hard_stop: true, rf: RF-03}
      - override: {rest_symptom: true, rest_symptom_first_time: true}
        expect: {tier: 0, hard_stop: false}
      - override: {onset_new: false, pattern_unchanged_duration_months: 24, rest_symptom: false}
        expect: {tier: 3, hard_stop: false}

