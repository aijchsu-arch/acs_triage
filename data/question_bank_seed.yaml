# 問題庫種子 v0.2
# 來源：v0.2 盲性審查表「仍缺少的關鍵資訊／必問問題」欄位，去重後結構化；
#       v0.2 新增中間帶（問卷 Part B）所需 slot 與題目，並依 Part C 調整優先級（rules_version 0.3.0）。
# script_zh 是客服逐字唸的句子（草稿，待 Q-10 定稿）；why_zh 只給客服看。
# priority: redflag（先問，可觸發 Hard stop）> decisive（決定 acute vs chronic）> refine
# 不得在程式碼中寫死任何問題文字。

bank_version: "0.4"
rules_version_required: "0.4.0"

slots:
  - id: ongoing_now
    type: yes_no
  - id: episode_duration_min
    type: duration
  - id: presyncope
    type: yes_no
  - id: syncope
    type: yes_no
  - id: dyspnea_complaint
    type: yes_no
    note: 由 extractor 設定（開場白提到喘但未分級）；無對應題目，用來讓呼吸類題目變成相關
  - id: dyspnea_grade
    type: choice
    choices: [none, exertional_heavy, exertional_daily, rest]
  - id: cant_finish_sentence
    type: yes_no
  - id: onset_new
    type: yes_no
  - id: threshold_decreased
    type: yes_no
  - id: rest_symptom
    type: yes_no
  - id: rest_symptom_first_time
    type: yes_no
  - id: dyspnea_acute
    type: yes_no
  - id: pattern_unchanged_duration_months
    type: duration
  - id: symptom_character
    type: choice
    choices: [pressure, pain, tightness, jaw_shoulder_heaviness, epigastric, vague, other, none]   # none = 病人明確否認胸部症狀
  - id: exertion_relation
    type: choice
    choices: [exertion_only, rest_only, both, unclear]
  - id: diaphoresis
    type: yes_no
  - id: nausea
    type: yes_no
  - id: orthopnea_pnd
    type: yes_no
  - id: edema
    type: yes_no
  - id: cad_history
    type: yes_no
  - id: pci_history
    type: yes_no
  - id: antiplatelet_interrupted
    type: yes_no
  - id: ntg_use_increased
    type: yes_no
  - id: third_party_call
    type: yes_no
    note: 由 extractor 從開場白判定（「我爸爸」「我媽」），無對應題目
  - id: patient_reachable
    type: yes_no
  - id: drug_time_correlation
    type: yes_no
  # ---- v0.2 新增（中間帶） ----
  - id: last_episode_timing
    type: choice
    choices: [ongoing, today, yesterday_within_24h, over_24h, unknown]
  - id: recurrence
    type: yes_no
    note: 自首次發作以來是否有多次發作；T2 條件需 false（C2），<24h 者多次仍 T1（B19）
  - id: onset_weeks_ago
    type: duration
  - id: threshold_decrease_timescale
    type: choice
    choices: [days, weeks_to_month, unknown]
  - id: consult_screen_positive
    type: yes_no
    note: Q-14f 合併篩檢；答「沒有」→ 衍生心悸、姿勢性頭暈、檢查異常待追蹤皆為 false
  - id: palpitations
    type: yes_no
  - id: postural_dizziness
    type: yes_no
  - id: new_medication_recent
    type: yes_no
  - id: reproducible_mechanical
    type: yes_no
  - id: cough_related
    type: yes_no
  - id: postprandial_relieved
    type: yes_no
  - id: pending_abnormal_test
    type: yes_no
  - id: consult_topic
    type: choice
    choices: [appointment_admin, education_question, medication_handling, minor_noncardiac, symptom, unknown]
  - id: recent_pci_months
    type: duration
  - id: symptom_vs_pre_pci
    type: choice
    choices: [milder, same, worse]

questions:
  # ---------- redflag：先問 ----------
  - id: Q-ONGOING-01
    slot_id: ongoing_now
    priority: redflag
    answer_type: yes_no
    script_zh: "請問您現在這個當下，胸口的不舒服還在嗎？"
    why_zh: "仍持續 → RF-03 Hard stop"
  - id: Q-SYNCOPE-01
    slot_id: presyncope
    priority: redflag
    answer_type: yes_no
    script_zh: "不舒服的時候，有沒有覺得快要昏倒、眼前發黑？"
    why_zh: "合併瀕厥 → RF-01 Hard stop"
  - id: Q-SYNCOPE-02
    slot_id: syncope
    priority: redflag
    answer_type: yes_no
    script_zh: "有沒有真的昏過去、失去意識？"
    why_zh: "意識喪失 → RF-05 Hard stop"
  - id: Q-DYSPNEA-GRADE-01
    slot_id: dyspnea_grade
    priority: redflag
    answer_type: choice
    choices: [exertional_heavy, exertional_daily, rest]
    script_zh: "請問您的喘，是只有做很激烈的運動才會喘、還是平常走路做家事就會喘、還是現在坐著休息也會喘？"
    why_zh: "三段分級；坐著休息也喘 → RF-02 Hard stop（即使疑似焦慮）"
  - id: Q-DYSPNEA-SENTENCE-01
    slot_id: cant_finish_sentence
    priority: redflag
    answer_type: yes_no
    script_zh: "您現在講話會不會喘到一句話講不完？"
    why_zh: "無法完整說一句話 → RF-04 Hard stop"
  - id: Q-DIAPH-01
    slot_id: diaphoresis
    priority: redflag
    answer_type: yes_no
    script_zh: "不舒服的時候有沒有冒冷汗？"
    why_zh: "胸部不適合併明顯冒汗 → RF-06 Hard stop（C5 A）"

  # ---------- decisive：決定 acute vs chronic ----------
  - id: Q-REACHABLE-01
    slot_id: patient_reachable
    priority: decisive
    answer_type: yes_no
    script_zh: "現在能不能請病人本人來接電話，或有人在他身邊可以確認他現在的狀況？"
    why_zh: "第三方來電；本人不可及 → Tier 9 + safety net"
    # D-40：排在 decisive 第一題（只在第三方來電時出題），避免被 max_questions 擠掉
  - id: Q-ONSET-01
    slot_id: onset_new
    priority: decisive
    answer_type: yes_no
    script_zh: "這種不舒服是最近才第一次出現的，還是以前就有過一樣的感覺？"
    why_zh: "新發 → T0 方向；長期 → 看是否無變化"
  - id: Q-THRESHOLD-01
    slot_id: threshold_decreased
    priority: decisive
    answer_type: yes_no
    script_zh: "跟以前比，是不是比較輕的活動就會不舒服？例如以前要爬樓梯才會，現在走平路也會？"
    why_zh: "活動閾值下降 → T0"
  - id: Q-REST-01
    slot_id: rest_symptom
    priority: decisive
    answer_type: yes_no
    script_zh: "坐著或躺著休息的時候，有沒有發作過？"
    why_zh: "休息時症狀 → T0 方向"
  - id: Q-REST-02
    slot_id: rest_symptom_first_time
    priority: decisive
    answer_type: yes_no
    script_zh: "休息時發作是最近才開始的嗎？"
    why_zh: "新發休息時症狀 → T0"
  - id: Q-DYSPNEA-ACUTE-01
    slot_id: dyspnea_acute
    priority: decisive
    answer_type: yes_no
    script_zh: "這個喘是今天忽然變明顯的，還是這幾個禮拜、幾個月慢慢變的？"
    why_zh: "突發且與基線明顯不同 → T0；漸進 → 可能降級"
  - id: Q-PATTERN-01
    slot_id: pattern_unchanged_duration_months
    priority: decisive
    answer_type: duration
    script_zh: "這個情況維持一樣、完全沒有變嚴重，大概多久了？"
    why_zh: "≥6 個月無變化是 T3 的必要條件"
  - id: Q-CHARACTER-01
    slot_id: symptom_character
    priority: decisive
    answer_type: choice
    choices: [pressure, pain, tightness, jaw_shoulder_heaviness, epigastric, vague]
    script_zh: "您說的不舒服，比較像被壓住、悶悶的、刺痛，還是說不上來？位置在哪裡？"
    why_zh: "未定性（怪怪的／說不上來）→ Tier 9 條件之一"
  - id: Q-EXERTION-01
    slot_id: exertion_relation
    priority: decisive
    answer_type: choice
    choices: [exertion_only, rest_only, both, unclear]
    script_zh: "不舒服通常是在走路、用力的時候出現，停下來就好？還是休息的時候也會？"
    why_zh: "活動關係與停止即緩解"
  - id: Q-DRUGTIME-01
    slot_id: drug_time_correlation
    priority: refine
    answer_type: yes_no
    script_zh: "不舒服是每次都在吃藥後固定的時間出現嗎？跟走路、用力有沒有關係？"
    why_zh: "藥物歸因不得降級（ND-03）；只用來判斷是否需要補問活動關係"

  - id: Q-ORTHO-01
    slot_id: orthopnea_pnd
    priority: decisive
    answer_type: yes_no
    script_zh: "躺平會不會更喘、要墊高枕頭？半夜會不會喘醒？"
    why_zh: "端坐呼吸／夜間喘醒 → 一律 T0（不是 Hard stop；C1 B）"
  - id: Q-TIMING-01
    slot_id: last_episode_timing
    priority: decisive
    answer_type: choice
    choices: [today, yesterday_within_24h, over_24h]
    script_zh: "最後一次不舒服是什麼時候好的？是今天、昨天、還是更早以前？"
    why_zh: "今天 → T0；昨天（<24h）無再發 → T1；≥24h 無再發 → T2（DV-1）"
  - id: Q-RECUR-01
    slot_id: recurrence
    priority: decisive
    answer_type: yes_no
    script_zh: "那次之後到現在，有沒有再發作過？"
    why_zh: "≥24h 無再發 → T2（C2）；<24h 多次發作仍 T1（B19）；今日有發作 → T0"
  - id: Q-ONSET-WEEKS-01
    slot_id: onset_weeks_ago
    priority: decisive
    answer_type: duration
    script_zh: "這種情況大概是多久以前開始的？幾天、幾個禮拜、還是幾個月？"
    why_zh: "新發穩定勞累性 ≥2 週 → T2（DV-2）"
  - id: Q-THRESH-TIME-01
    slot_id: threshold_decrease_timescale
    priority: decisive
    answer_type: choice
    choices: [days, weeks_to_month]
    script_zh: "變成比較輕的活動就會不舒服，是這幾天的事，還是這幾個禮拜慢慢變的？"
    why_zh: "數天 → T0；數週～一個月 → T1（C3 B）；不明 → 視為數天"
  - id: Q-PALP-01
    slot_id: palpitations
    priority: decisive
    answer_type: yes_no
    script_zh: "是心跳突然很快或不規則嗎？發作的時候有沒有胸悶或快昏倒？"
    why_zh: "單純心悸無胸悶無暈 → T3；系統不建議居家 ECG（C8 B）"
  - id: Q-POSTURAL-01
    slot_id: postural_dizziness
    priority: decisive
    answer_type: yes_no
    script_zh: "頭暈是站起來的時候才有、幾秒就好嗎？坐著躺著會不會？"
    why_zh: "姿勢性 + 新藥 → T2（B10）；合併胸部症狀 → RF-01"
  - id: Q-REPRO-01
    slot_id: reproducible_mechanical
    priority: decisive
    answer_type: yes_no
    script_zh: "用手按胸口、深呼吸或轉身的時候會不會痛？走路或用力會不會更痛？"
    why_zh: "可重現且活動不加重 → T3（B14）；活動會加重 → 回一般規則"
  - id: Q-COUGH-01
    slot_id: cough_related
    priority: decisive
    answer_type: yes_no
    script_zh: "是咳嗽的時候才痛嗎？不咳就不會痛？"
    why_zh: "咳嗽相關且非勞累性 → T3（B16）"
  - id: Q-POSTPRANDIAL-01
    slot_id: postprandial_relieved
    priority: decisive
    answer_type: yes_no
    script_zh: "是吃飽後出現，打嗝或排氣之後就完全好了嗎？"
    why_zh: "carve-out 四條件之一（DV-5）；仍需確認無冒汗、非活動相關、現在已完全沒事"
  - id: Q-MILDER-01
    slot_id: symptom_vs_pre_pci
    priority: decisive
    answer_type: choice
    choices: [milder, same, worse]
    script_zh: "跟放支架之前比，現在的不舒服是比較輕、差不多、還是比較重？"
    why_zh: "較輕且純勞累、無休息、無閾值下降 → T3（DV-4）；相同或更重 → T0"
  - id: Q-SCREEN-01
    slot_id: consult_screen_positive
    priority: decisive
    answer_type: yes_no
    script_zh: "另外再確認一下：最近有沒有心跳突然很快或亂跳、站起來會頭暈，或是有做過檢查被說異常、還沒回診的？"
    why_zh: "無症狀諮詢的合併篩檢（Q-14f）；任一項有 → 逐項追問，可能升級"
  - id: Q-CONSULT-01
    slot_id: consult_topic
    priority: decisive
    answer_type: choice
    choices: [appointment_admin, education_question, medication_handling, minor_noncardiac, symptom]
    script_zh: "請問今天主要是想問什麼？是門診時間、回診前的準備、藥怎麼吃、還是身體有不舒服？"
    why_zh: "門診時間／排程 → T3；回診準備等衛教問題、藥物處理、輕微非心臟問題 → T4（DV-7）；任何症狀 → 走症狀流程"

  # ---------- refine ----------
  - id: Q-NAUSEA-01
    slot_id: nausea
    priority: refine
    answer_type: yes_no
    script_zh: "有沒有想吐、噁心？"
    why_zh: "伴隨症狀"
  - id: Q-EDEMA-01
    slot_id: edema
    priority: refine
    answer_type: yes_no
    script_zh: "腳有沒有腫？"
    why_zh: "合併日常勞動性喘 → T2（B12）；單獨水腫不升級"
  - id: Q-CAD-01
    slot_id: cad_history
    priority: refine
    answer_type: yes_no
    script_zh: "請問有沒有被醫師診斷過冠心症或心臟血管的問題？"
    why_zh: "病史本身不升級（ND-05）"
  - id: Q-PCI-01
    slot_id: pci_history
    priority: refine
    answer_type: yes_no
    script_zh: "有沒有放過心臟支架？"
    why_zh: "病史本身不升級（ND-05）"
  - id: Q-ANTIPLT-01
    slot_id: antiplatelet_interrupted
    priority: refine
    answer_type: yes_no
    script_zh: "抗血小板的藥（例如阿斯匹靈、保栓通）最近有沒有停過或漏吃？"
    why_zh: "近期中斷是升級因子（ND-05）"
  - id: Q-NTG-01
    slot_id: ntg_use_increased
    priority: decisive        # Q-14a：C4 A 使 NTG 用量增加 → T0
    answer_type: yes_no
    script_zh: "舌下含片最近用得比以前多嗎？"
    why_zh: "NTG 有效不得降級（ND-04）；用量增加是惡化線索"
  - id: Q-DURATION-01
    slot_id: episode_duration_min
    priority: refine
    answer_type: duration
    script_zh: "這一次不舒服持續了大概多久？幾分鐘、還是超過半小時？"
    why_zh: "持續時間；≥20 分鐘未緩解為候選紅旗（Q-07 未裁定前不改變等級，故列 refine）"
  - id: Q-NEWMED-01
    slot_id: new_medication_recent
    priority: refine
    answer_type: yes_no
    script_zh: "最近有沒有換藥或加新的藥？"
    why_zh: "姿勢性頭暈的藥物歸因僅用於 T2 判定（B10），不得降級（ND-03）"
  - id: Q-PENDINGTEST-01
    slot_id: pending_abnormal_test
    priority: refine
    answer_type: yes_no
    script_zh: "最近有沒有做過心臟檢查被說異常、醫師叫您回診但還沒回去的？"
    why_zh: "檢查異常待追蹤且無症狀 → T1（B9）"
  - id: Q-PCI-RECENT-01
    slot_id: recent_pci_months
    priority: refine
    answer_type: duration
    script_zh: "支架是多久以前放的？"
    why_zh: "一年內 + 抗血小板中斷 → ND-05"
