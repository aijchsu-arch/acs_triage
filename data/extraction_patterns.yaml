# 規則路徑 Slot Extractor 的關鍵詞樣式（Phase 0）。
# 僅在 v0.2 + 中間帶共 38 個開場白與紅旗測試句上驗證過；M3 之後由模型路徑補強。
# 語法：Python re。每個 slot：positive（值→樣式）、negative（明確否定→值）。
# guard_negation: 正向命中前方（同子句、6 字內）若出現否定詞則丟棄該命中。

patterns_version: "0.1"

# 這些片語含「不」但不是否定，比對否定詞前先遮罩
non_negation_phrases: [不舒服, 不太舒服, 不適, 說不上來, 不知道, 不確定, 不太對, 不一樣, 不規則, 不正常, 不動]
negation_tokens: [從來沒有, 從來沒, 從沒, 還沒有, 還沒, 也沒有, 也沒, 沒有, 沒, 不會, 不太會, 不, 無, 未]
clause_splitters: "[，。；、！？,.;!?\\n ]"

slots:
  # ---------------- 症狀性質（依序取第一個命中） ----------------
  symptom_character:
    ordered_values:
      - value: jaw_shoulder_heaviness
        patterns: ["下顎", "左肩", "肩膀.{0,3}(沉重|重重|痠)", "左手臂.{0,3}(沉重|痠|麻)"]
      - value: pressure
        patterns: ["壓住", "壓迫", "壓著", "被壓", "重壓", "壓著一樣"]
      - value: epigastric
        patterns: ["上腹", "胃.{0,2}(悶|脹|痛)", "胸口脹", "脹脹"]
      - value: tightness
        patterns: ["胸悶", "胸口悶", "悶", "緊感", "緊緊", "胸口緊", "胸口很緊"]
      - value: pain
        patterns: ["胸口.{0,4}痛", "胸痛", "會痛", "也痛", "刺痛", "心絞痛", "痛"]
      - value: vague
        patterns: ["怪怪的", "不太舒服", "不舒服", "說不上來", "不太對", "不適"]
    none_patterns:
      - "胸口(沒有|沒|不會)(痛|悶|不舒服)"
      - "(沒有|沒)(任何)?(新的)?(胸悶|胸痛|發作|不舒服|不適|症狀)"
      - "(還沒有|還沒)(不舒服|症狀)"
      - "(他|其他)(都)?(沒有|沒)(不舒服|症狀)"
      - "目前(沒有|沒)(症狀|不舒服)"

  # ---------------- 紅旗相關 ----------------
  presyncope:
    positive: ["差點(昏倒|暈倒|昏過去)", "快(要)?(昏倒|暈倒|昏過去)", "眼前(發)?黑", "快暈", "頭昏到快", "幾乎昏倒"]
    negative: ["(沒有|沒|也沒有|不會|或)(暈|昏|頭暈)(倒)?", "沒有.{0,6}暈"]
  syncope:
    positive: ["(?<!差點)(?<!快要)(?<!快)昏倒了", "昏過去了?", "失去意識", "(?<!差點)(?<!快要)(?<!快)暈倒了", "昏迷", "人倒下去"]
    negative: ["(沒有|沒|不會)(真的)?(昏|暈)(倒|過去)"]
  ongoing_now:
    positive: ["現在(還|仍)(在|有|會)", "還在(痛|悶|喘|不舒服|壓)", "一直(痛|悶|沒好|不舒服)", "持續(到現在|中|著)?", "(還沒|沒有)好", "目前仍", "現在也還", "到現在都還"]
    negative: ["(自己)?好了", "就好", "緩解", "休息後.{0,3}(比較)?好", "(現在)?(完全)?沒事", "已經不(痛|悶|會)", "停下來就好"]
  diaphoresis:
    positive: ["冒(冷)?汗", "流冷汗", "盜汗", "滿身汗", "全身冒汗"]
    negative: ["(沒有|沒|也沒)(冒)?(冷)?汗"]
  cant_finish_sentence:
    positive: ["講不完", "說不完", "講不下去", "一句話.{0,4}(講|說)不(完|下去)", "喘到.{0,4}(講|說)不", "嘴唇(發)?(紫|紺|黑)", "發紺"]
    negative: ["(可以|還能|還可以).{0,3}(講|說)(完)?(話)?", "(沒有|不會)喘到"]

  # ---------------- 呼吸困難 ----------------
  dyspnea_grade:
    ordered_values:
      - value: rest
        patterns: ["(坐著|休息|靜止|不動|現在|講話|說話|什麼都沒做)(時|的時候)?(也|還|就|都)?(會)?(很)?喘", "喘到(坐|躺)不"]
      - value: exertional_daily
        patterns: ["(走路|做家事|走一點路|日常|平常活動|爬一層|走平地|洗澡|穿衣).{0,8}喘", "走路.{0,4}比平常喘"]
      - value: exertional_heavy
        patterns: ["(激烈|很用力|跑步|劇烈|爬山).{0,6}喘"]
    none_patterns: ["(沒有|沒|不會)(新的)?(胸悶、)?喘", "喘或暈", "不會喘"]
    # 「坐著不會／坐著不喘」→ 明確非 rest（不設 none，因為仍可能有勞動性喘）
    explicit_not_rest: ["(坐著|休息|靜止)(時|的時候)?(不會|沒有|不(?!動))(喘)?"]
  dyspnea_acute:
    positive: ["(今天|今早|剛才|剛剛|突然|忽然).{0,6}(喘|呼吸)", "喘.{0,8}(和|跟)平常差很多"]
    negative: ["(這幾個禮拜|這一個禮拜|這個禮拜|這(一)?個月|最近幾個月|慢慢|逐漸).{0,10}喘"]
  orthopnea_pnd:
    positive: ["躺(下|平|著).{0,8}喘", "墊高枕頭", "半夜.{0,4}喘醒", "喘醒", "坐起來才(比較)?(好|不喘)"]
    negative: ["躺(下|平|著).{0,4}(不會|沒有|不)(更)?喘"]
  edema:
    positive: ["(腳|小腿|腿|腳踝|下肢).{0,4}腫"]
    negative: ["(腳|小腿|腿).{0,4}(沒有|沒|不會)腫"]

  # ---------------- 時序與型態 ----------------
  onset_new:
    positive: ["第一次", "以前(從來)?(都)?沒有(過)?", "以前(是)?完全沒有", "以前不會(這樣)?", "從來沒有(過)?$", "從來沒有(這樣)?[，。]", "(禮拜|週|星期|天)前開始", "(前天|昨天|最近|這幾天)開始"]
    negative: ["很多年", "多年", "(兩|二|三|幾|[0-9]+)年來", "一直都是", "過去(一|兩|三)年都是", "我的心絞痛以前"]
  rest_symptom:
    positive: ["(躺著|坐著|休息|靜止|看電視|睡覺|睡到半夜)(的時候|時)?[^，。；不沒]{0,6}(也|就|會|時)[^，。；不沒]{0,4}(發作|悶|痛|不舒服|壓)", "休息(時|的時候)?也(會|有)"]
    negative: ["休息(時|的時候)?(從來)?(沒有|沒|不會|都沒有)", "(沒有|沒)休息時(發作)?", "休息時從來沒有", "靜止.{0,3}(沒|不)", "(坐著|躺著|休息時)(不會|不|沒有)"]
  rest_symptom_first_time:
    positive: ["以前只有.{0,4}(運動|走路|用力|爬|活動).{0,12}(也|現在|今晚|今天|這次)", "第一次.{0,6}(休息|躺|坐)"]
    negative: ["休息時.{0,4}(以前|一直|也都).{0,4}(有|會)", "一年來.{0,4}(偶爾|也)"]
  threshold_decreased:
    positive: ["原本只有.{0,12}才(會)?.{0,20}(也會|就會|也開始)", "(距離|時間|路).{0,6}(比以前|比較|變)(短|少|近)", "比較輕的活動", "走平地也會", "走一點(路)?就", "(更|比較)容易(悶|痛|不舒服|發作)", "(走|爬)(不到|沒多久).{0,6}就"]
    negative: ["沒有(任何)?變化", "沒有變嚴重", "完全相同", "都一樣", "完全沒有變"]
  threshold_decrease_timescale:
    ordered_values:
      - value: days
        patterns: ["這(兩|三|幾|二)天", "這幾天", "昨天", "今天", "前天"]
      - value: weeks_to_month
        patterns: ["這(一)?個月", "這幾個禮拜", "這幾週", "這(兩|三)個禮拜", "最近一個月", "一個月(來|內)"]
    requires_slot_true: threshold_decreased
  ntg_use_increased:
    positive: ["(舌下|硝化|耐絞寧|NTG|救心).{0,16}(變成|變多|增加|比以前多|多了|次數變|愈來愈多|越來越多)", "(含|吃)(的)?(次數|頻率).{0,6}(變多|增加|比以前多)"]
    negative: ["(舌下|硝化|NTG).{0,10}(沒有變|一樣|不變)", "(舌下|含片).{0,10}(過期|可以用嗎|怎麼用)"]
  pattern_unchanged_duration_months:
    stability_phrases: ["都一樣", "沒有(任何)?變化", "沒有變嚴重", "完全相同", "完全沒有變", "都沒有變", "最近完全相同", "每次都一樣"]
    uncertainty_phrases: ["沒注意", "不確定", "不知道.{0,6}有(沒有)?變", "是不是有變"]
    duration_patterns:
      - {pattern: "半年", months: 6}
      - {pattern: "(六|6)個月", months: 6}
      - {pattern: "(一|1)年", months: 12}
      - {pattern: "(兩|二|2)年", months: 24}
      - {pattern: "(三|3)年", months: 36}
      - {pattern: "很多年|多年", months: 60}
      - {pattern: "(三|3)個禮拜", months: 0.75}
      - {pattern: "(兩|二|2)個禮拜", months: 0.5}
      - {pattern: "(一|1)個禮拜", months: 0.25}
      - {pattern: "(一|1)個月", months: 1}
  onset_weeks_ago:
    patterns:
      - {pattern: "(三|3)個禮拜前開始", weeks: 3}
      - {pattern: "(兩|二|2)個禮拜前開始", weeks: 2}
      - {pattern: "(一|1)個禮拜前開始", weeks: 1}
      - {pattern: "一個月前開始", weeks: 4}
      - {pattern: "這一個禮拜", weeks: 1}
      - {pattern: "這個禮拜", weeks: 1}
      - {pattern: "這兩個禮拜", weeks: 2}
      - {pattern: "這三個禮拜", weeks: 3}
    requires_slot_true: onset_new
  last_episode_timing:
    # 僅在 chest_symptom_present 時計算；邏輯在程式碼：today(未被否定) > yesterday > over_24h
    today_markers: ["今天", "今晚", "今早", "剛才", "剛剛", "下午", "早上", "中午", "(?<!昨天)(?<!昨)晚上"]
    today_negated: ["今天.{0,8}(沒有|沒|還沒)(再)?(發作|不舒服|痛|悶)", "今天到現在都沒"]
    yesterday_markers: ["昨天", "昨晚"]
    over_24h_markers: ["前天", "([兩三幾0-9]+)天前", "上(個)?禮拜", "上週", "上星期"]
  recurrence:
    positive: ["(又|再次|再)發作(了)?", "多次", "好幾次", "兩三次", "反覆"]
    negative: ["(都)?(沒有|沒)(再)發作", "沒有再發"]
  episode_duration_min:
    patterns:
      - {pattern: "(大概|約|差不多)?十分鐘", minutes: 10}
      - {pattern: "(大概|約)?(二十|20)分鐘", minutes: 20}
      - {pattern: "(大概|約)?(三十|30)分鐘|半小時", minutes: 30}
      - {pattern: "(大概|約)?五分鐘", minutes: 5}
      - {pattern: "幾分鐘", minutes: 3}
      - {pattern: "一兩分鐘", minutes: 2}
  exertion_relation:
    # 邏輯在程式碼：有勞累觸發且未否定 → exertion_only（若 rest 亦真 → both）；勞累被否定 → unclear
    exertion_markers: ["快走", "走路", "走平地", "爬.{0,3}樓梯", "上坡", "用力", "運動", "做家事", "搬(重物|東西)", "活動", "走很快", "走一點路", "走的時候"]
    exertion_negated: ["走路(時)?(不會|沒有|沒)(更)?(悶|痛|不舒服)", "(運動|用力|走路)(也)?(不會|沒有)(更)?(悶|痛)", "走路沒有悶"]
    relief_markers: ["停下來就好", "休息(後|就)(才)?(比較)?好", "停下來.{0,6}就好"]

  # ---------------- 病史與諮詢 ----------------
  cad_history:
    positive: ["冠心症", "冠狀動脈", "心絞痛", "心臟病", "心肌梗塞", "心導管", "心臟血管"]
  pci_history:
    positive: ["支架", "PCI", "氣球擴張", "通血管"]
  recent_pci_months:
    patterns:
      - {pattern: "(上個月|上月)(放|做).{0,4}支架", months: 1}
      - {pattern: "(放|做)(了)?支架(半年|六個月)|支架半年", months: 6}
      - {pattern: "(三|3)年前(放|做)", months: 36}
      - {pattern: "(一|1)年前(放|做)", months: 12}
      - {pattern: "(兩|二|2)年前(放|做)", months: 24}
    requires_slot_true: pci_history
  antiplatelet_interrupted:
    positive: ["(停|漏|沒吃|忘記吃|中斷|停掉)(了)?.{0,6}(保栓通|阿斯匹靈|抗血小板|百無凝|倍林達|抗凝血|血小板)", "(保栓通|阿斯匹靈|抗血小板|百無凝|倍林達).{0,6}(停|漏|沒吃|中斷)"]
    negative: ["(保栓通|阿斯匹靈|抗血小板).{0,6}(都有吃|沒有停|按時)"]
  symptom_vs_pre_pci:
    ordered_values:
      - value: milder
        patterns: ["比(放)?(支架|手術|之前|以前)(前|之前)?(輕|好)(很多)?", "比.{0,6}前輕"]
      - value: worse
        patterns: ["比(放)?(支架|手術)(前|之前)(重|嚴重|厲害)"]
      - value: same
        patterns: ["(跟|和)(放)?(支架|手術)(前|之前)(一樣|差不多)"]
  third_party_call:
    positive: ["我(爸|媽|爸爸|媽媽|先生|太太|老公|老婆|阿公|阿嬤|公公|婆婆|兒子|女兒|家人|哥哥|姐姐|弟弟|妹妹)"]
  patient_reachable:
    positive: ["在我(旁邊|身邊)", "他(現在)?在(我)?(這|旁邊|身邊)", "可以(讓他|請他)(來)?(接|聽)"]
    negative: ["不在(我)?(旁邊|身邊|家)", "聯絡不(到|上)", "他(現在)?不在"]
  palpitations:
    positive: ["心跳.{0,6}(很快|快|亂|不規則|加速)", "心悸", "心跳加速", "心臟(跳得)?很快"]
    negative: ["(沒有|沒)心悸"]
  postural_dizziness:
    positive: ["站起來.{0,6}(頭暈|暈|眼前)", "起身.{0,4}(頭暈|暈)", "姿勢.{0,3}暈", "站起來.{0,4}幾秒"]
  new_medication_recent:
    positive: ["(換|加|開|新)(了)?.{0,4}(新的)?.{0,6}藥", "新的.{0,4}藥", "最近.{0,4}(換|加)藥"]
  reproducible_mechanical:
    positive: ["按(下去|壓|著)?.{0,4}(會)?痛", "深呼吸.{0,3}(也|會)?痛", "轉身.{0,3}痛", "搬(重物|東西)", "舉(手|高).{0,3}痛"]
  cough_related:
    positive: ["咳(嗽)?(的時候|時)?.{0,4}(會|才)?痛", "不咳就不(會)?痛", "咳.{0,3}胸口.{0,3}痛"]
  postprandial_relieved:
    positive: ["(吃太飽|吃飽|飯後|吃完).{0,15}(打嗝|排氣|放屁).{0,6}(就好|好了|緩解|沒事)"]
  pending_abnormal_test:
    positive: ["(運動心電圖|心電圖|檢查|超音波|核醫|心臟檢查).{0,12}(異常|有問題|不正常|有點問題).{0,24}(回診|還沒|沒掛|掛不到)", "還沒掛到號"]
  drug_time_correlation:
    positive: ["每次(吃藥|服藥).{0,6}(後|之後)(固定|都)"]
  consult_topic:
    # 僅在 no symptom 時計算；優先序如下
    ordered_values:
      - value: education_question
        patterns: ["空腹", "抽血", "飲食", "可以吃(什麼)?", "回診前", "可以運動", "能不能運動", "要注意什麼"]
      - value: medication_handling
        patterns: ["(藥|舌下|含片|保栓通|阿斯匹靈).{0,12}(可以|怎麼|過期|補吃|吃回|要不要|還要|停)", "補吃", "過期", "怎麼吃", "要不要.{0,6}吃", "忘記吃"]
      - value: appointment_admin
        patterns: ["門診時間", "掛號", "確認.{0,8}(門診|回診|時間)", "改時間", "預約", "回診時間"]
      - value: minor_noncardiac
        patterns: ["疫苗", "手臂痠", "感冒", "流鼻水", "牙齒", "皮膚", "肌肉痠"]
