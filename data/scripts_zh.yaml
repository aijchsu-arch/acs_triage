# 客服逐字腳本（草稿）—— 定稿由 Clinical Owner 與客服主管負責（Q-10）。
# 標 DRAFT 的文字不得直接上線。程式碼只引用 id，不寫死文字。

scripts_version: "0.1-draft"

scripts:
  S-HS:
    status: DRAFT
    text: "依照您剛才描述的狀況，我們現在需要請您立刻撥打 119，或請旁邊的人立刻幫您撥打。我會在線上陪您到確認已經撥通為止。請不要開車、不要自己走去醫院。"
  S-T0:
    status: DRAFT
    text: "您描述的狀況需要今天立刻到急診讓醫師評估。如果現在症狀又出現或變嚴重，請直接撥打 119。我會同步通知我們的護理師。"
  S-T1:
    status: DRAFT
    text: "您的狀況需要今天內讓醫療人員評估。我現在幫您轉給護理師，由護理師安排今天的評估方式；如果轉接不到，我們會在 30 分鐘內回電給您。"
  S-T2:
    status: DRAFT
    text: "您的狀況建議在兩三天內回診讓醫師評估。我幫您安排最近的快速門診時段。"
  S-T3:
    status: DRAFT
    text: "依您描述，目前可以依照原本的門診時間回診。"
  S-T3-EXPEDITE:
    status: DRAFT
    text: "依您描述，目前不需要急診，但建議把門診提前。我幫您看最近可以提前的時段。"
  S-T4:
    status: DRAFT
    text: "依您描述，目前可以先在家觀察，我跟您說明要注意的事情。"
  S-T9:
    status: DRAFT
    text: "為了更準確判斷，我請我們的護理師直接跟您談。請稍等，我幫您轉接。"
  S-T9-CALLBACK:
    status: DRAFT
    text: "護理師目前線上忙碌，我們會在 30 分鐘內回電給您。在這之前如果症狀變嚴重，請直接撥打 119。"
  S-SN-A:
    status: DRAFT
    text: "如果接下來出現胸口壓迫感持續不退、坐著也會喘、快昏倒或昏倒、冒冷汗，請立刻撥打 119，不要再打客服。"
  S-SN-B:
    status: DRAFT
    text: "提醒您，如果之後出現胸口壓迫感持續不退、坐著也會喘、快昏倒或昏倒、冒冷汗，請立刻撥打 119。"
  S-REPEAT:
    status: DRAFT
    text: "不好意思，剛才沒有聽清楚，請您再說一次：您剛才是說＿＿嗎？"
  S-RF-CONFIRM:
    status: DRAFT
    text: "我需要先確認一件事：您現在這個當下，胸口還會不舒服嗎？有沒有覺得快要昏倒？"
  S-FAMILY-RELAY:
    status: DRAFT
    text: "請您現在就聯絡病人本人或在他身邊的人，確認他現在的狀況。如果他胸口還在不舒服、快昏倒、冒冷汗或坐著也喘，請立刻撥打 119。"
  # D-50 紅旗題／關鍵題複誦確認（措辭待 Q-10 定稿）。{question} = 題目原文 script_zh，{answer} = 值的中文（見下方 confirm_value_labels_zh）
  S-CONFIRM-BACK:
    status: DRAFT
    text: "我跟您確認一下，剛剛問您『{question}』，您的回答是『{answer}』，對嗎？"
  S-CONFIRM-BACK-ASK-YESNO:        # 是非題、沒聽出答案
    status: DRAFT
    text: "我再跟您確認一次，{question}請您回答『有』還是『沒有』。"
  S-CONFIRM-BACK-ASK:              # 選擇題、沒聽出答案：用題目原文再問一次
    status: DRAFT
    text: "我再跟您確認一次，{question}"

# D-50 複誦確認時「值的中文」。DRAFT，待 Q-10 定稿：yes_no 依 Clinical Owner 指示用「有／沒有」；
# choice：題目 script_zh 列出的選項用題目原本的用語（標 # 題目），題目沒列的沿用模擬病人口語（抄自 sim/patient.py，未經核可）。
# 只給複誦用；模擬病人（sim/patient.py 的 _ZH_CHOICE）維持自己的標籤，讓 LLM 病人評估與 OpenAI slot 抽取能與既有基線比較。
confirm_value_labels_zh:
  status: DRAFT
  yes_no: {true: 有, false: 沒有}
  symptom_character:              # Q-CHARACTER-01：「…比較像被壓住、悶悶的、刺痛，還是說不上來？…」
    pressure: 被壓住              # 題目
    pain: 刺痛                    # 題目
    tightness: 悶悶的             # 題目
    jaw_shoulder_heaviness: 下顎和肩膀沉重
    epigastric: 上腹悶脹
    vague: 說不上來               # 題目
    other: 其他
    none: 沒有
  dyspnea_grade:                  # Q-DYSPNEA-GRADE-01：「…是只有做很激烈的運動才會喘、還是平常走路做家事就會喘、還是現在坐著休息也會喘？」
    exertional_heavy: 只有做很激烈的運動才會喘   # 題目
    exertional_daily: 平常走路做家事就會喘       # 題目
    rest: 現在坐著休息也會喘                     # 題目
    none: 沒有
